<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NLnet / NGI0 Core — Sovereign Open-Source Browser & Toolchain Proof — B8G Demo Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060a12; color: #e2e8f0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; display: flex; flex-direction: column; height: 100vh; }
    main { flex: 1; display: grid; place-items: center; padding: 16px; }
    canvas { max-width: 100%; max-height: calc(100vh - 84px); border: 1px solid #1e293b; border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
    footer { height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 14px; background: #0b111d; border-top: 1px solid #1e293b; }
    button { background: #0f293a; color: #38bdf8; border: 1px solid #38bdf866; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
    .bar { flex: 1; height: 6px; background: #1e293b; border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #4ade80); width: 0%; }
    .meta { font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <main><canvas id="c" width="1280" height="720"></canvas></main>
  <footer>
    <button id="play">Pause</button>
    <button id="restart">Restart</button>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="meta" id="meta">0.0s / 19.0s</div>
  </footer>
  <script>
    const SB = {"id":"nlnet-ngi0-grant-demo","title":"NLnet / NGI0 Core — Sovereign Open-Source Browser & Toolchain Proof","tagline":"Reproducible zero-WSL cross-compilation, open E2EE sync ABI, and zero-telemetry local-first tooling.","width":1280,"height":720,"fps":30,"totalDurationSec":19,"scenes":[{"id":"nl-intro","kind":"title","durationSec":4,"title":"SOVEREIGN OPEN INFRASTRUCTURE","subtitle":"Built from source on bare metal — 100% open-core, zero telemetry, zero cloud CI lock-in.","badge":"NLNET // NGI0 PROOF","accentHex":"#38bdf8","windowTitle":"b8g-shell // nl-intro","commands":[],"metrics":[{"label":"Cloud Telemetry","value":"0 BYTES","accent":"emerald"},{"label":"Cross-Compile","value":"ZERO-WSL","accent":"cyan"},{"label":"Atomic Parity","value":"118 / 118","accent":"amber"}],"switcherPanes":[]},{"id":"nl-parity-proof","kind":"split","durationSec":5.5,"title":"REPRODUCIBLE CROSS-SHELL TOOLCHAIN","subtitle":"Every CLI tool verified identically across POSIX sh, PowerShell, and cmd.exe.","badge":"LIVE VERIFY // ACT 2","accentHex":"#4ade80","windowTitle":"b8g-shell // parity-and-maintain","commands":[{"prompt":"b8g$","cmd":".\\bin\\b8g-bin-parity verify","outputLines":["[b8g-bin-parity] PASS: 118/118 tools have complete atomic (posix, cmd, ps1) triplets."],"durationMs":370.5,"exitCode":0},{"prompt":"b8g$","cmd":".\\bin\\b8g-maintain status","outputLines":["You are the Awesome-OS Sovereign Maintainer Agent.","Bin Parity: 118/118 (0 violations).","Tracked Upstreams (8):","- chromium [git-repo]: local=78291322da remote=skipped status=local-only -> sections/chromium-build/","- node-src [git-sparse]: local=0482448 remote=skipped status=local-only -> sections/chromium-build/node-embed-abi/","- nwjs [git-sparse]: local=47a32c0 remote=skipped status=local-only -> intersections/b8g-nwjs/","- vscode-oss [git-repo]: local=18e4bb19 remote=skipped status=local-only -> intersections/b8g-vscode-oss/","- workerd [git-sparse]: local=6f40a3b remote=skipped status=local-only -> intersections/b8g-workerd-wasi/","- wasmer [git-sparse]: local=29e67da remote=skipped status=local-only -> intersections/b8g-workerd-wasi/","- obs-studio [git-repo]: local=1a44b7f remote=skipped status=local-only -> intersections/b8g-stream/"],"durationMs":612,"exitCode":0}],"metrics":[{"label":"B8G-ABI DLLs","value":"19 BUILT","accent":"cyan","barPct":100},{"label":"Linux ELF .so","value":"ZIG 0.14.1","accent":"emerald","barPct":100},{"label":"Test Suites","value":"21+ PASS","accent":"emerald","barPct":100},{"label":"Vendor Lock-In","value":"ZERO","accent":"amber","barPct":100}],"switcherPanes":[]},{"id":"nl-pillars","kind":"switcher","durationSec":6,"title":"FOUR PUBLIC-GOOD DELIVERABLES","subtitle":"Open specifications, auditable C11 ABIs, and self-hostable developer freedom.","badge":"PUBLIC GOODS // ACT 3","accentHex":"#38bdf8","windowTitle":"b8g-shell // nl-pillars","commands":[],"metrics":[],"switcherPanes":[{"title":"Open B8G-Chrome + E2EE ABI","badge":"BROWSER","lines":["+ 11.8 KB Linux ELF ChromeMain","+ Pluggable OSS E2EE / Local sync","+ 233 us origin-scoped RAM wipe","+ Zero Google account required"],"accentHex":"#38bdf8"},{"title":"B8G Sovereign Git Forge","badge":"FORGE","lines":["+ Zero-DB Smart HTTP Git server","+ Issues, PRs, Kanban, Releases","+ Self-host on any $5 Linux box","+ Breaks Big-Tech Git monopoly"],"accentHex":"#4ade80"},{"title":"B8G Terminal Chrome","badge":"ACCESSIBLE","lines":["+ 24-bit half-block + live DOM","+ Kitty Graphics Protocol mode","+ Runs over SSH / low-bandwidth","+ 99.92% Carbonyl debloat"],"accentHex":"#fbbf24"},{"title":"Zero-WSL Native Cross-Build","badge":"TOOLCHAIN","lines":["+ LLVM 24 multicall + Zig 0.14.1","+ Compiles Linux ELF64 on Win11","+ Deterministic .b8p CAS caching","+ Eliminates cloud CI monopolies"],"accentHex":"#c084fc"}]},{"id":"nl-outro","kind":"title","durationSec":3.5,"title":"BUILT FOR THE NEXT GENERATION INTERNET","subtitle":"Auditable, local-first, reproducible software — proven live on real hardware.","badge":"NLNET // READY","accentHex":"#4ade80","windowTitle":"b8g-shell // nl-outro","commands":[],"metrics":[{"label":"License","value":"OPEN CORE","accent":"emerald"},{"label":"Demo Render","value":"4s IN RAM","accent":"cyan"}],"switcherPanes":[]}]};
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const fill = document.getElementById('fill');
    const meta = document.getElementById('meta');
    let playing = true, elapsed = 0, last = performance.now();
    document.getElementById('play').onclick = (e) => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; };
    document.getElementById('restart').onclick = () => { elapsed = 0; playing = true; };

    function activeScene(sec) {
      let acc = 0;
      for (let i = 0; i < SB.scenes.length; i++) {
        const s = SB.scenes[i];
        if (sec < acc + s.durationSec) return { s, i, lt: sec - acc };
        acc += s.durationSec;
      }
      return { s: SB.scenes[SB.scenes.length - 1], i: SB.scenes.length - 1, lt: 0 };
    }

    function drawWindow(x, y, w, h, title, accent, active) {
      ctx.fillStyle = 'rgba(10,15,25,0.95)';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#101826';
      ctx.fillRect(x, y, w, 34);
      ctx.strokeStyle = active ? accent : 'rgba(148,163,184,0.3)';
      ctx.lineWidth = active ? 2 : 1;
      ctx.strokeRect(x, y, w, h);
      ['#f87171','#fbbf24','#4ade80'].forEach((c, k) => {
        ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 18 + k * 18, y + 17, 5, 0, Math.PI * 2); ctx.fill();
      });
      ctx.fillStyle = active ? '#e2e8f0' : '#94a3b8';
      ctx.font = '13px ui-monospace, monospace';
      ctx.fillText(title, x + 76, y + 22);
    }

    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (playing) elapsed = (elapsed + dt) % Math.max(1, SB.totalDurationSec);
      const { s, i, lt } = activeScene(elapsed);
      fill.style.width = ((elapsed / SB.totalDurationSec) * 100).toFixed(1) + '%';
      meta.textContent = 'SCENE ' + (i + 1) + '/' + SB.scenes.length + ' · ' + elapsed.toFixed(1) + 's / ' + SB.totalDurationSec.toFixed(1) + 's';

      const W = canvas.width, H = canvas.height;
      ctx.fillStyle = '#070c16'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = s.accentHex + '18'; ctx.lineWidth = 1;
      for (let gx = (elapsed * 14) % 48; gx < W; gx += 48) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
      for (let gy = (elapsed * 8) % 48; gy < H; gy += 48) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }

      ctx.fillStyle = '#080d16'; ctx.fillRect(0, 0, W, 38);
      ctx.fillStyle = s.accentHex; ctx.font = 'bold 13px ui-monospace, monospace';
      ctx.fillText('B8G-OS // OFFSCREEN RAM COMPOSITOR', 18, 24);
      ctx.fillStyle = '#94a3b8'; ctx.fillText(s.badge, W - 240, 24);

      if (s.kind === 'title') {
        drawWindow(W * 0.08, H * 0.16, W * 0.84, H * 0.62, s.badge, s.accentHex, true);
        ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 34px ui-monospace, monospace';
        ctx.fillText(s.title, W * 0.12, H * 0.36);
        ctx.fillStyle = '#94a3b8'; ctx.font = '16px ui-monospace, monospace';
        ctx.fillText(SB.tagline, W * 0.12, H * 0.43);
      } else if (s.kind === 'terminal' || s.kind === 'split') {
        const lw = s.kind === 'split' ? W * 0.57 : W - 56;
        drawWindow(28, 60, lw, H - 150, s.windowTitle, s.accentHex, true);
        let y = 114;
        ctx.font = '13px ui-monospace, monospace';
        for (const c of s.commands) {
          ctx.fillStyle = s.accentHex; ctx.fillText(c.prompt + ' ' + c.cmd, 44, y); y += 22;
          for (const ln of c.outputLines.slice(0, 14)) {
            ctx.fillStyle = ln.includes('PASS') || ln.includes('0 ') ? '#4ade80' : '#e2e8f0';
            ctx.fillText(ln, 44, y); y += 20;
          }
          y += 10;
        }
        if (s.kind === 'split') {
          drawWindow(48 + lw, 60, W - lw - 76, H - 150, 'LIVE TELEMETRY // B8G-ABI', '#4ade80', false);
          let my = 118;
          for (const m of s.metrics) {
            ctx.fillStyle = '#94a3b8'; ctx.font = '12px ui-monospace, monospace'; ctx.fillText(m.label.toUpperCase(), 66 + lw, my);
            ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 22px ui-monospace, monospace'; ctx.fillText(m.value, 66 + lw, my + 26);
            my += 78;
          }
        }
      } else if (s.kind === 'switcher') {
        const panes = s.switcherPanes;
        const activeIdx = Math.floor((lt / Math.max(0.5, s.durationSec)) * panes.length) % Math.max(1, panes.length);
        const cw = (W - 74) / 2, ch = (H - 168) / 2;
        panes.slice(0, 4).forEach((p, idx) => {
          const px = 28 + (idx % 2) * (cw + 18), py = 60 + Math.floor(idx / 2) * (ch + 18);
          drawWindow(px, py, cw, ch, p.title + ' [' + p.badge + ']', p.accentHex, idx === activeIdx);
          ctx.font = '13px ui-monospace, monospace';
          p.lines.slice(0, 7).forEach((ln, k) => {
            ctx.fillStyle = idx === activeIdx ? '#e2e8f0' : '#64748b';
            ctx.fillText(ln, px + 16, py + 58 + k * 22);
          });
        });
      }

      ctx.fillStyle = '#060a12'; ctx.fillRect(0, H - 66, W, 66);
      ctx.fillStyle = s.accentHex; ctx.fillRect(0, H - 66, W * (elapsed / SB.totalDurationSec), 3);
      ctx.font = 'bold 14px ui-monospace, monospace'; ctx.fillText(s.title.toUpperCase(), 24, H - 42);
      ctx.fillStyle = '#e2e8f0'; ctx.font = '14px ui-monospace, monospace'; ctx.fillText(s.subtitle, 24, H - 18);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
